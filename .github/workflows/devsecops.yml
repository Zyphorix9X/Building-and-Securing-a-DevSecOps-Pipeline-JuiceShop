name: IE3142 DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - feature/cicd-security-automation
      - feature/secrets-management
      - 'demo/**'

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Security Regression Tests
    runs-on: ubuntu-latest

    env:
      CTF_KEY: ie3142-ci-test-ctf-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # ---------------------------------------------------------
      # Provision JWT signing keys from GitHub Actions Secrets
      # ---------------------------------------------------------
      - name: Provision JWT signing keys
        shell: bash
        env:
          JWT_PRIVATE_KEY_PEM: ${{ secrets.JWT_PRIVATE_KEY_PEM }}
          JWT_PUBLIC_KEY_PEM: ${{ secrets.JWT_PUBLIC_KEY_PEM }}
        run: |
          test -n "$JWT_PRIVATE_KEY_PEM"
          test -n "$JWT_PUBLIC_KEY_PEM"

          umask 077
          mkdir -p secrets

          printf '%s' "$JWT_PRIVATE_KEY_PEM" > secrets/jwt.key
          printf '%s' "$JWT_PUBLIC_KEY_PEM" > secrets/jwt.pub

          echo "JWT_PRIVATE_KEY_FILE=$GITHUB_WORKSPACE/secrets/jwt.key" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY_FILE=$GITHUB_WORKSPACE/secrets/jwt.pub" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # Verify key files exist without printing secret contents
      # ---------------------------------------------------------
      - name: Verify JWT key files
        shell: bash
        run: |
          test -s "$JWT_PRIVATE_KEY_FILE"
          test -s "$JWT_PUBLIC_KEY_FILE"

          echo "JWT signing key files are available."

      # ---------------------------------------------------------
      # Create CTF key required by Juice Shop during CI tests
      # ---------------------------------------------------------
      - name: Create CI CTF key
        shell: bash
        run: |
          printf '%s' "$CTF_KEY" > ctf.key
          chmod 600 ctf.key

          if [ ! -s ctf.key ]; then
            echo "ERROR: ctf.key was not created."
            exit 1
          fi

          echo "CTF key file is available for CI tests."

      # ---------------------------------------------------------
      # Install project dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: npm install

      # ---------------------------------------------------------
      # Build backend
      # ---------------------------------------------------------
      - name: Build backend
        run: npm run build:server

      # ---------------------------------------------------------
      # Security regression tests
      # ---------------------------------------------------------
      - name: Run IE3142 security regression tests
        run: |
          node \
            --import ./test/api/helpers/test-env.mjs \
            --import tsx \
            --test \
            --test-force-exit \
            test/api/ie3142-security.test.ts

      # ---------------------------------------------------------
      # Gate 1 - Semgrep SAST
      # ---------------------------------------------------------
      - name: Semgrep SAST security scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            semgrep/semgrep semgrep scan \
            --config /src/.semgrep/juice-shop.yml \
            /src/routes/login.ts \
            /src/routes/search.ts \
            --error

      # ---------------------------------------------------------
      # Gate 2 - Backend dependency vulnerability scan
      # ---------------------------------------------------------
      - name: Backend dependency vulnerability scan
        shell: bash
        run: |
          npm audit --omit=dev --json > backend-audit.json || true

          node -e "
            const a = require('./backend-audit.json');
            const v = a.metadata.vulnerabilities;

            console.log('Backend audit:', v);

            if (v.high > 16 || v.critical > 7) {
              console.error('Dependency vulnerability baseline exceeded');
              process.exit(1);
            }

            console.log('Backend dependency baseline accepted');
          "

      # ---------------------------------------------------------
      # Gate 2 - Frontend dependency vulnerability scan
      # ---------------------------------------------------------
      - name: Frontend dependency vulnerability scan
        working-directory: ./frontend
        shell: bash
        run: |
          npm audit --omit=dev --json > frontend-audit.json || true

          node -e "
            const a = require('./frontend-audit.json');
            const v = a.metadata.vulnerabilities;

            console.log('Frontend audit:', v);

            if (v.high > 4 || v.critical > 0) {
              console.error('Dependency vulnerability baseline exceeded');
              process.exit(1);
            }

            console.log('Frontend dependency baseline accepted');
          "

      # ---------------------------------------------------------
      # Gate 3 - Gitleaks secret scan
      # ---------------------------------------------------------
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # Build Docker image
      # ---------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t ie3142-juice-shop:${{ github.sha }} \
            .

      # ---------------------------------------------------------
      # Gate 4 - Trivy container vulnerability scan
      #
      # Generate a JSON report first. Existing vulnerabilities in
      # the intentionally vulnerable Juice Shop image are handled
      # using the documented project baseline below.
      # ---------------------------------------------------------
      - name: Trivy container vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ie3142-juice-shop:${{ github.sha }}'
          format: 'json'
          output: 'trivy-results.json'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      # ---------------------------------------------------------
      # Enforce Trivy vulnerability baseline
      #
      # Current reviewed baseline:
      # HIGH     = 42
      # CRITICAL = 6
      #
      # Pipeline fails if HIGH or CRITICAL findings increase.
      # ---------------------------------------------------------
      - name: Enforce Trivy vulnerability baseline
        shell: bash
        run: |
          node -e "
            const fs = require('fs');

            const report = JSON.parse(
              fs.readFileSync('trivy-results.json', 'utf8')
            );

            const vulnerabilities = (report.Results || [])
              .flatMap(result => result.Vulnerabilities || []);

            const high = vulnerabilities.filter(
              vulnerability => vulnerability.Severity === 'HIGH'
            ).length;

            const critical = vulnerabilities.filter(
              vulnerability => vulnerability.Severity === 'CRITICAL'
            ).length;

            console.log('Trivy HIGH:', high);
            console.log('Trivy CRITICAL:', critical);
            console.log('Allowed HIGH baseline: 42');
            console.log('Allowed CRITICAL baseline: 6');

            if (high > 42 || critical > 6) {
              console.error('Trivy vulnerability baseline exceeded');
              process.exit(1);
            }

            console.log('Trivy vulnerability baseline accepted');
          "