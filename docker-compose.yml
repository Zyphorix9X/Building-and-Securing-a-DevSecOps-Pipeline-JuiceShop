services:
  juice-shop:
    build:
      context: .
      dockerfile: Dockerfile

    image: ie3142-juice-shop:secure

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      NODE_ENV: production
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key

    secrets:
      - jwt_private_key
      - jwt_public_key

    volumes:
      - ./ctf.key:/juice-shop/ctf.key:ro

secrets:
  jwt_private_key:
    file: ./secrets/jwt.key

  jwt_public_key:
    file: ./secrets/jwt.pub